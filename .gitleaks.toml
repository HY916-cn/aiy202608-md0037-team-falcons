# Gitleaks configuration.
#
# We extend the upstream default ruleset and add narrowly scoped allowlists for
# synthetic SQL fixture ids that trigger the `generic-api-key` rule in Git
# history. The allowlists below only apply when BOTH the target rule and the
# fixture test path match.
#
# Scope of these allowlists:
#   * They apply ONLY to the `generic-api-key` rule.
#   * They apply ONLY to the specific governance pgTAP fixture files below.
#   * They match ONLY the synthetic fixture id namespaces used by those tests.
#   * All other rules, files, and strings are still scanned normally.

title = "dolphin-cloud gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Governance idempotency test fixture ids"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''supabase/tests/005_governance_operations_idempotency\.test\.sql''']
regexes = [
  '''^(?:test-idem|idem-op-test)-[a-z0-9-]+$''',
]

[[allowlists]]
description = "Governance wallet and fine test fixture ids"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''supabase/tests/007_governance_wallet_fine_reversal\.test\.sql''']
regexes = [
  '''^(?:coin|fine)-[a-z0-9-]+$''',
]
