name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history
        run: |
          mkdir -p reports/secret
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source=/repo --redact=100 --no-banner \
            --config=/repo/.gitleaks.toml \
            --report-format=sarif \
            --report-path=/repo/reports/secret/gitleaks.sarif
      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-${{ github.run_id }}
          path: reports/secret
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare reports
        run: mkdir -p reports/unit
      - name: Verify dependency alignment
        run: pnpm verify:deps 2>&1 | tee reports/dependencies.txt
      - name: Check formatting baseline
        run: pnpm format:check 2>&1 | tee reports/format.txt
      - name: Lint
        run: pnpm lint 2>&1 | tee reports/lint.txt
      - name: Typecheck
        run: pnpm typecheck 2>&1 | tee reports/typecheck.txt
      - name: Unit tests
        run: pnpm test:ci
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports-${{ github.run_id }}
          path: reports
          if-no-files-found: warn
          retention-days: 14

  database-tests:
    name: Database and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect database workspace
        id: database
        shell: bash
        run: |
          if [[ -f supabase/config.toml ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Database tests pending" >> "$GITHUB_STEP_SUMMARY"
            echo "The Supabase workspace is not present on this commit. The job becomes mandatory automatically when supabase/config.toml is added." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install pnpm
        if: steps.database.outputs.enabled == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Set up Node.js
        if: steps.database.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependencies
        if: steps.database.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run database and RLS tests
        if: steps.database.outputs.enabled == 'true'
        run: pnpm database:test

  exports:
    name: Expo export smoke
    needs:
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Export and verify Web
        run: pnpm smoke:web
      - name: Export and verify Android
        run: pnpm smoke:android
