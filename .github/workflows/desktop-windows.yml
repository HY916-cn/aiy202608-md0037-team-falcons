name: Desktop Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-windows.yml"
      - "apps/client/**"
      - "apps/desktop/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/ci/verify-export.mjs"
      - "scripts/desktop/**"

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  build-windows:
    name: Build Windows portable EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run desktop security tests
        run: pnpm desktop:test
      - name: Build Windows portable EXE
        run: pnpm desktop:dist:win
      - name: Verify EXE and SHA-256
        id: verify
        run: pnpm desktop:verify:win
      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dolphincloud-class-terminal-${{ github.sha }}
          path: artifacts/desktop
          if-no-files-found: error
          retention-days: 14
