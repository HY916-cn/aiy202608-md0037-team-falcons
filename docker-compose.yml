services:
  web:
    image: dolphincloud-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}
        - EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}
        - EXPO_PUBLIC_AI_GATEWAY_FUNCTION=${EXPO_PUBLIC_AI_GATEWAY_FUNCTION}
        - EXPO_PUBLIC_APP_ENV=${EXPO_PUBLIC_APP_ENV:-production}
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
