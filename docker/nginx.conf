server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # SPA/Expo Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static resources caching (1 year)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2?|eot|ttf|otf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # HTML files no-cache
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
