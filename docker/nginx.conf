server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Immutable cache for fingerprinted assets (Expo Web uses _expo/static)
    location ^~ /_expo/static/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Missing fingerprinted/static files must fail instead of returning the app shell.
    location ~* \.(?:css|gif|ico|jpe?g|js|json|map|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA/Expo Router fallback
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
        # HTML and other files no-cache
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
