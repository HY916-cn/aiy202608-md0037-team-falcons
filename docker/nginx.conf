map $http_x_forwarded_proto $public_request_scheme {
    default $scheme;
    ~*^https$ https;
    ~*^http$ http;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # The client resolves the reserved backend marker from window.location.origin.
    # Keep JavaScript bytes immutable so HTTPS reverse proxies cannot inject an
    # internal HTTP scheme into the public bundle.

    # Keep auth, data, file storage and AI requests on the same browser origin.
    location ~ ^/(auth|rest|storage|functions|realtime)/v1/ {
        proxy_pass http://host.docker.internal:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_request_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Immutable cache for fingerprinted assets (Expo Web uses _expo/static)
    location ^~ /_expo/static/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Missing fingerprinted/static files must fail instead of returning the app shell.
    location ~* \.(?:css|gif|ico|jpe?g|js|json|map|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA/Expo Router fallback
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
        # HTML and other files no-cache
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
